<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard + NotebookLM</title>

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="header">
    <h1>My Analytics Dashboard</h1>
    <p>Looker Studio + NotebookLM</p>
  </header>

  <!-- LOOKER STUDIO -->
  <section class="section">
    <h2>📊 Looker Studio</h2>

    <div class="iframe-container top-frame">
      <iframe
        src="https://datastudio.google.com/reporting/301fb879-7465-47b1-b437-6cf68598a38d"
        frameborder="0"
        allowfullscreen
        sandbox="allow-storage-access-by-user-activation allow-scripts allow-same-origin allow-popups allow-forms">
      </iframe>
    </div>
  </section>

  <!-- NOTEBOOKLM -->
  <section class="section">
    <h2>📘 NotebookLM</h2>

    <div class="iframe-container bottom-frame">
      <iframe
        src="https://notebooklm.google.com/notebook/8447e538-0470-4b2b-ac1e-28f511fb7ab9"
        frameborder="0"
        allowfullscreen>
      </iframe>
    </div>
  </section>

  <footer class="footer">
    <p>Created with GitHub Pages</p>
  </footer>

</body>
</html>
