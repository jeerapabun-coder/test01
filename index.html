<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dashboard & AI Assistant</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Sarabun", Roboto, sans-serif;
    background: #eff6ff;
    color: #0f172a;
  }
  body {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }
  header {
    background: linear-gradient(90deg, #0ea5e9, #38bdf8);
    color: #fff;
    padding: 12px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: 0 2px 6px rgba(14,165,233,0.25);
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand img {
    width: 32px;
    height: 32px;
    border-radius: 6px;
    background: #fff;
    padding: 2px;
    object-fit: contain;
  }
  header h1 { font-size: 18px; font-weight: 600; }
  .header-controls { display: flex; align-items: center; gap: 6px; }
  .lang-switch button,
  .settings-link {
    background: rgba(255,255,255,0.15);
    color: #fff;
    border: 1px solid rgba(255,255,255,0.3);
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    transition: background 0.2s;
    text-decoration: none;
    display: inline-block;
  }
  .lang-switch button.active,
  .lang-switch button:hover,
  .settings-link:hover {
    background: rgba(255,255,255,0.35);
  }
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 16px;
    padding: 16px;
    max-width: 1400px;
    width: 100%;
    margin: 0 auto;
  }
  .panel {
    background: #fff;
    border-radius: 10px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .panel-header {
    padding: 10px 16px;
    border-bottom: 1px solid #bae6fd;
    font-weight: 600;
    font-size: 14px;
    color: #0c4a6e;
    background: #f0f9ff;
  }
  .dashboard-panel { flex: 0 0 auto; }
  .dashboard-frame {
    width: 100%;
    height: auto;
    aspect-ratio: 16 / 9; /* ปรับขนาดสัดส่วนตามรายงาน Looker */
    min-height: 480px;
    border: none;
    transition: height 0.3s ease;
  }
  /* ── Fullscreen mode ── */
  .dashboard-panel.fullscreen {
    position: fixed;
    inset: 0;
    z-index: 999;
    border-radius: 0;
    margin: 0;
    display: flex;
    flex-direction: column;
  }
  .dashboard-panel.fullscreen .dashboard-frame {
    height: calc(100vh - 44px);
    min-height: unset;
  }
  body.fullscreen-active > *:not(.dashboard-panel):not(#api-warning) {
    display: none !important;
  }
  /* ── Fullscreen button ── */
  .panel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .panel-header-title { flex: 1; }
  .fullscreen-btn {
    background: none;
    border: 1px solid #bae6fd;
    border-radius: 6px;
    padding: 3px 8px;
    font-size: 13px;
    cursor: pointer;
    color: #0369a1;
    transition: background 0.15s;
    line-height: 1.4;
    white-space: nowrap;
  }
  .fullscreen-btn:hover { background: #e0f2fe; }
  .chat-panel {
    flex: 1 1 auto;
    min-height: 400px;
  }
  .chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    max-height: 50vh;
  }
  .msg {
    max-width: 80%;
    padding: 10px 14px;
    border-radius: 12px;
    line-height: 1.5;
    font-size: 14px;
    word-wrap: break-word;
    white-space: pre-wrap;
  }
  .msg.user {
    align-self: flex-end;
    background: #0ea5e9;
    color: #fff;
    border-bottom-right-radius: 2px;
  }
  .msg.bot {
    align-self: flex-start;
    background: #e0f2fe;
    color: #0f172a;
    border-bottom-left-radius: 2px;
  }
  .msg.system {
    align-self: center;
    background: #fef3c7;
    color: #92400e;
    font-size: 12px;
    font-style: italic;
  }
  .typing {
    align-self: flex-start;
    color: #6b7280;
    font-size: 13px;
    padding: 4px 14px;
  }
  .chat-input {
    display: flex;
    border-top: 1px solid #e5e7eb;
    padding: 10px;
    gap: 8px;
    background: #fff;
  }
  .chat-input textarea {
    flex: 1;
    border: 1px solid #bae6fd;
    border-radius: 8px;
    padding: 10px;
    resize: none;
    font-family: inherit;
    font-size: 14px;
    outline: none;
    min-height: 42px;
    max-height: 120px;
  }
  .chat-input textarea:focus { border-color: #0ea5e9; }
  .chat-input button {
    background: #0ea5e9;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 0 18px;
    cursor: pointer;
    font-weight: 600;
    transition: background 0.2s;
  }
  .chat-input button:hover:not(:disabled) { background: #0284c7; }
  .chat-input button:disabled { background: #9ca3af; cursor: not-allowed; }
  .status {
    font-size: 12px;
    color: #0369a1;
    padding: 6px 16px;
    background: #f0f9ff;
    border-top: 1px solid #bae6fd;
  }
  footer {
    text-align: center;
    font-size: 12px;
    color: #6b7280;
    padding: 12px;
  }
  @media (max-width: 640px) {
    .dashboard-frame { height: 55vh; min-height: 320px; }
    header h1 { font-size: 15px; }
    .msg { max-width: 90%; }
  }
  /* ── API Key Warning Banner ── */
  .api-warning {
    display: none;
    align-items: center;
    gap: 12px;
    background: linear-gradient(135deg, #fff7ed, #fef3c7);
    border: 1.5px solid #f59e0b;
    border-radius: 10px;
    padding: 14px 18px;
    margin: 0;
    animation: slideDown 0.3s ease;
  }
  .api-warning.visible { display: flex; }
  @keyframes slideDown {
    from { opacity: 0; transform: translateY(-8px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .api-warning-icon { font-size: 22px; flex-shrink: 0; }
  .api-warning-body { flex: 1; }
  .api-warning-body strong { display: block; color: #92400e; font-size: 14px; margin-bottom: 2px; }
  .api-warning-body span  { color: #b45309; font-size: 13px; }
  .api-warning-btn {
    background: #f59e0b;
    color: #fff;
    border: none;
    border-radius: 7px;
    padding: 8px 16px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.2s;
    text-decoration: none;
    display: inline-block;
  }
  .api-warning-btn:hover { background: #d97706; }
</style>
</head>
<body>
<header>
  <div class="brand">
    <img src="OIP.webp" alt="logo" />
    <h1 data-i18n="title">Dashboard & AI Assistant</h1>
  </div>
  <div class="header-controls">
    <div class="lang-switch">
      <button id="lang-th" class="active" onclick="setLanguage('th')">ไทย</button>
      <button id="lang-en" onclick="setLanguage('en')">English</button>
    </div>
    <a class="settings-link" href="settings.html" data-i18n-title="settingsLink" title="ตั้งค่า">⚙️</a>
  </div>
</header>

<!-- API Key Warning Banner -->
<div id="api-warning" class="api-warning" role="alert">
  <div class="api-warning-icon">⚠️</div>
  <div class="api-warning-body">
    <strong id="warn-title">ยังไม่ได้ตั้งค่า Gemini API Key</strong>
    <span id="warn-body">กรุณากรอก API Key ในหน้า Settings เพื่อเริ่มใช้งาน AI Assistant</span>
  </div>
  <a href="settings.html" class="api-warning-btn" id="warn-btn">⚙️ ตั้งค่า</a>
</div>

<main>
  <section class="panel dashboard-panel" id="dashboard-panel">
    <div class="panel-header">
      <span class="panel-header-title" data-i18n="dashboardTitle">แดชบอร์ด</span>
      <button class="fullscreen-btn" id="fs-btn" onclick="toggleFullscreen()" title="เต็มจอ">⛶ เต็มจอ</button>
    </div>
    <iframe
      id="looker-frame"
      class="dashboard-frame"
      src="https://lookerstudio.google.com/embed/reporting/YOUR_LOOKER_REPORT_ID/page/YOUR_PAGE_ID"
      frameborder="0"
      scrolling="no"
      allowfullscreen
      sandbox="allow-storage-access-by-user-activation allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox">
    </iframe>
  </section>

  <section class="panel chat-panel">
    <div class="panel-header" data-i18n="chatTitle">ผู้ช่วย AI</div>
    <div class="chat-messages" id="chat-messages"></div>
    <div class="status" id="status" data-i18n="loadingData">กำลังโหลดข้อมูล...</div>
    <div class="chat-input">
      <textarea
        id="chat-input"
        rows="1"
        data-i18n-placeholder="inputPlaceholder"
        placeholder="พิมพ์คำถามของคุณ..."
        onkeydown="handleKey(event)"></textarea>
      <button id="send-btn" onclick="sendMessage()" data-i18n="sendBtn">ส่ง</button>
    </div>
  </section>
</main>

<footer data-i18n="footer">
  Powered by Gemini · ข้อมูลจาก Google Sheets
</footer>

<script src="config.js"></script>
<script>
  // ============================================================
  // CONFIG - ค่าเริ่มต้นมาจาก config.js (shared across devices)
  // user override ได้ผ่าน settings.html (เก็บใน localStorage ของเครื่องนั้น)
  // ============================================================
  const DEFAULT_CONFIG = window.APP_CONFIG;
  const STORAGE_KEY = "dashboard_ai_settings_v1";

  function loadConfig() {
    try {
      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
      return { ...DEFAULT_CONFIG, ...saved };
    } catch { return { ...DEFAULT_CONFIG }; }
  }
  const CONFIG = loadConfig();

  // ============================================================
  // i18n
  // ============================================================
  const I18N = {
    th: {
      title: "แดชบอร์ด & ผู้ช่วย AI",
      dashboardTitle: "แดชบอร์ด",
      chatTitle: "ผู้ช่วย AI",
      inputPlaceholder: "พิมพ์คำถามของคุณ...",
      sendBtn: "ส่ง",
      footer: "ขับเคลื่อนโดย Gemini · ข้อมูลจาก Google Sheets",
      welcome: "สวัสดีครับ! ผมเป็นผู้ช่วย AI ที่ตอบจากข้อมูลใน Google Sheet คุณถามอะไรได้เลย",
      loadingData: "กำลังโหลดข้อมูล...",
      dataReady: "พร้อมตอบคำถามแล้ว",
      dataError: "ไม่สามารถโหลดข้อมูลจาก Google Sheet ได้ ตรวจสอบ SHEET_CSV_URL",
      thinking: "กำลังคิด...",
      errorPrefix: "เกิดข้อผิดพลาด: ",
      systemPromptLang: "ภาษาไทย",
      settingsLink: "ตั้งค่า",
    },
    en: {
      title: "Dashboard & AI Assistant",
      dashboardTitle: "Dashboard",
      chatTitle: "AI Assistant",
      inputPlaceholder: "Type your question...",
      sendBtn: "Send",
      footer: "Powered by Gemini · Data from Google Sheets",
      welcome: "Hi! I'm an AI assistant that answers based on the Google Sheet data. Ask me anything.",
      loadingData: "Loading data...",
      dataReady: "Ready to answer questions",
      dataError: "Failed to load Google Sheet data. Check SHEET_CSV_URL.",
      thinking: "Thinking...",
      errorPrefix: "Error: ",
      systemPromptLang: "English",
      settingsLink: "Settings",
    },
  };

  let currentLang = "th";
  let knowledgeBase = "";  // ข้อมูลที่ดึงมาจาก Google Sheet
  let chatHistory = [];    // history สำหรับ context multi-turn

  // ============================================================
  // Language switching
  // ============================================================
  function setLanguage(lang) {
    currentLang = lang;
    document.documentElement.lang = lang;
    document.querySelectorAll("[data-i18n]").forEach(el => {
      const key = el.getAttribute("data-i18n");
      if (I18N[lang][key]) el.textContent = I18N[lang][key];
    });
    document.querySelectorAll("[data-i18n-placeholder]").forEach(el => {
      const key = el.getAttribute("data-i18n-placeholder");
      if (I18N[lang][key]) el.placeholder = I18N[lang][key];
    });
    document.querySelectorAll("[data-i18n-title]").forEach(el => {
      const key = el.getAttribute("data-i18n-title");
      if (I18N[lang][key]) el.title = I18N[lang][key];
    });
    document.getElementById("lang-th").classList.toggle("active", lang === "th");
    document.getElementById("lang-en").classList.toggle("active", lang === "en");
  }

  function t(key) { return I18N[currentLang][key] || key; }

  // ============================================================
  // Chat UI
  // ============================================================
  function addMessage(role, text) {
    const container = document.getElementById("chat-messages");
    const div = document.createElement("div");
    div.className = "msg " + role;
    div.textContent = text;
    container.appendChild(div);
    container.scrollTop = container.scrollHeight;
    return div;
  }

  function addTyping() {
    const container = document.getElementById("chat-messages");
    const div = document.createElement("div");
    div.className = "typing";
    div.id = "typing-indicator";
    div.textContent = t("thinking");
    container.appendChild(div);
    container.scrollTop = container.scrollHeight;
  }

  function removeTyping() {
    const el = document.getElementById("typing-indicator");
    if (el) el.remove();
  }

  function setStatus(text, isError = false) {
    const el = document.getElementById("status");
    el.textContent = text;
    el.style.color = isError ? "#dc2626" : "#6b7280";
  }

  function handleKey(e) {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  }

  // ============================================================
  // Load knowledge from Google Sheet (CSV)
  // ============================================================
  async function loadKnowledge() {
    try {
      const res = await fetch(CONFIG.SHEET_CSV_URL);
      if (!res.ok) throw new Error("HTTP " + res.status);
      const csv = await res.text();
      knowledgeBase = csvToReadable(csv);
      setStatus(t("dataReady"));
    } catch (err) {
      console.error("Sheet load failed:", err);
      setStatus(t("dataError"), true);
      knowledgeBase = "";
    }
  }

  // แปลง CSV เป็นข้อความที่อ่านง่าย (header: value, header: value ...)
  function csvToReadable(csv) {
    const rows = parseCSV(csv);
    if (rows.length === 0) return "";
    const headers = rows[0];
    const lines = [];
    for (let i = 1; i < rows.length; i++) {
      const row = rows[i];
      const parts = headers.map((h, idx) => `${h}: ${row[idx] ?? ""}`);
      lines.push(parts.join(" | "));
    }
    return lines.join("\n");
  }

  // CSV parser ที่รองรับ quoted fields และ comma ในค่า
  function parseCSV(text) {
    const rows = [];
    let row = [];
    let field = "";
    let inQuotes = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (inQuotes) {
        if (c === '"') {
          if (text[i + 1] === '"') { field += '"'; i++; }
          else inQuotes = false;
        } else field += c;
      } else {
        if (c === '"') inQuotes = true;
        else if (c === ",") { row.push(field); field = ""; }
        else if (c === "\n") { row.push(field); rows.push(row); row = []; field = ""; }
        else if (c === "\r") { /* skip */ }
        else field += c;
      }
    }
    if (field.length > 0 || row.length > 0) { row.push(field); rows.push(row); }
    return rows.filter(r => r.some(v => v && v.trim() !== ""));
  }

  // ============================================================
  // Send message to Gemini
  // ============================================================
  async function sendMessage() {
    const input = document.getElementById("chat-input");
    const text = input.value.trim();
    if (!text) return;

    input.value = "";
    document.getElementById("send-btn").disabled = true;
    addMessage("user", text);
    addTyping();

    try {
      const reply = await callGemini(text);
      removeTyping();
      addMessage("bot", reply);
      chatHistory.push({ role: "user", text });
      chatHistory.push({ role: "model", text: reply });
      // จำกัด history ไม่ให้ยาวเกินไป
      if (chatHistory.length > 20) chatHistory = chatHistory.slice(-20);
    } catch (err) {
      removeTyping();
      addMessage("bot", t("errorPrefix") + err.message);
      console.error(err);
    } finally {
      document.getElementById("send-btn").disabled = false;
      input.focus();
    }
  }

  async function callGemini(userMessage) {
    const knowledge = (knowledgeBase || "").slice(0, CONFIG.MAX_KNOWLEDGE_CHARS);
    const systemInstruction = `You are a helpful assistant. Answer the user's question using ONLY the knowledge base below when relevant. If the answer is not in the data, say so politely. Respond in ${t("systemPromptLang")}.

=== KNOWLEDGE BASE (from Google Sheet) ===
${knowledge || "(no data loaded)"}
=== END KNOWLEDGE BASE ===`;

    const contents = [];
    for (const m of chatHistory) {
      contents.push({ role: m.role, parts: [{ text: m.text }] });
    }
    contents.push({ role: "user", parts: [{ text: userMessage }] });

    const url = `https://generativelanguage.googleapis.com/v1beta/models/${CONFIG.GEMINI_MODEL}:generateContent?key=${CONFIG.GEMINI_API_KEY}`;
    const body = {
      systemInstruction: { parts: [{ text: systemInstruction }] },
      contents,
      generationConfig: { temperature: 0.4, maxOutputTokens: 1024 },
    };

    const res = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    if (!res.ok) {
      const errText = await res.text();
      throw new Error(`Gemini API ${res.status}: ${errText.slice(0, 200)}`);
    }
    const data = await res.json();
    const reply = data?.candidates?.[0]?.content?.parts?.map(p => p.text).join("") || "";
    return reply || "(empty response)";
  }

  // ============================================================
  // Init
  // ============================================================
  // ============================================================
  // API Key Guard
  // ============================================================
  function checkApiKey() {
    const banner = document.getElementById("api-warning");
    if (!CONFIG.GEMINI_API_KEY || CONFIG.GEMINI_API_KEY.trim() === "") {
      banner.classList.add("visible");
      document.getElementById("send-btn").disabled = true;
      document.getElementById("send-btn").title = currentLang === "th"
        ? "กรุณาตั้งค่า API Key ก่อนใช้งาน"
        : "Please set your API Key in Settings first";
    } else {
      banner.classList.remove("visible");
      document.getElementById("send-btn").disabled = false;
      document.getElementById("send-btn").title = "";
    }
  }

  // อัปเดต banner text ตาม language
  const _origSetLanguage = setLanguage;
  setLanguage = function(lang) {
    _origSetLanguage(lang);
    const warnTitles = { th: "ยังไม่ได้ตั้งค่า Gemini API Key", en: "Gemini API Key not set" };
    const warnBodies = {
      th: "กรุณากรอก API Key ในหน้า Settings เพื่อเริ่มใช้งาน AI Assistant",
      en: "Please enter your API Key in Settings to start using AI Assistant",
    };
    const warnBtns  = { th: "⚙️ ตั้งค่า", en: "⚙️ Settings" };
    const t = document.getElementById("warn-title");
    const b = document.getElementById("warn-body");
    const btn = document.getElementById("warn-btn");
    if (t) t.textContent  = warnTitles[lang]  || warnTitles.th;
    if (b) b.textContent  = warnBodies[lang]  || warnBodies.th;
    if (btn) btn.textContent = warnBtns[lang] || warnBtns.th;
  };

  // ============================================================
  // Fullscreen Toggle
  // ============================================================
  let isFullscreen = false;

  function toggleFullscreen() {
    const panel = document.getElementById("dashboard-panel");
    const btn   = document.getElementById("fs-btn");
    isFullscreen = !isFullscreen;

    if (isFullscreen) {
      panel.classList.add("fullscreen");
      document.body.classList.add("fullscreen-active");
      btn.textContent = "✕ ย่อจอ";
      btn.title = "ย่อจอ (ESC)";
      document.body.style.overflow = "hidden";
    } else {
      panel.classList.remove("fullscreen");
      document.body.classList.remove("fullscreen-active");
      btn.textContent = "⛶ เต็มจอ";
      btn.title = "เต็มจอ";
      document.body.style.overflow = "";
    }
  }

  // กด ESC เพื่อออกจากโหมดเต็มจอ
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && isFullscreen) toggleFullscreen();
  });

  window.addEventListener("DOMContentLoaded", () => {
    // ใส่ Looker URL จาก config (อาจถูก override จาก settings.html)
    document.getElementById("looker-frame").src = CONFIG.LOOKER_URL;
    setLanguage("th");
    checkApiKey();
    addMessage("bot", t("welcome"));
    loadKnowledge();
  });
</script>
</body>
</html>
